<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Self-assessment health monitor for astronauts on long-duration missions." />
    <title>Khonsu · Astronaut health</title>
    <script>
      /* Apply the saved theme before first paint so night mode never flashes bright day colours */
      try {
        if (JSON.parse(localStorage.getItem('ahm:settings-v1') || '{}').theme === 'night') {
          document.documentElement.dataset.theme = 'night'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a120d')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
