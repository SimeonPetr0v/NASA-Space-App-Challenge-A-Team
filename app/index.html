<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="Self-assessment health monitor for astronauts on long-duration missions." />
    <title>Khonsu · Astronaut health</title>
    <script>
      /* Apply the saved theme before first paint so dark and night modes never flash the light theme */
      try {
        var t = JSON.parse(localStorage.getItem('ahm:settings-v1') || '{}').theme
        if (t === 'night' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'night' ? '#1a120d' : '#16191f')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
